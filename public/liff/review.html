<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>評價回饋｜師傅抵嘉</title>
  <link rel="stylesheet" href="/liff/styles.css">
</head>
<body data-page="review">
  <main class="page">
    <header class="page-header">
      <div class="hero-card">
        <p class="eyebrow">師傅抵嘉</p>
        <h1>評價回饋</h1>
        <p class="lead">留下這次服務體驗，之後平台推薦和服務品質都會更準。</p>
      </div>
    </header>

    <p id="status" class="notice" hidden></p>
    <section id="order-panel" class="panel">載入案件中...</section>

    <form id="review-form" class="form-shell">
      <section class="form-section">
        <div class="section-title">
          <h2>本次評價</h2>
          <p>分數和心得都可以寫，若只想快速完成，也可以只給分數。</p>
        </div>

        <label id="rating-field">評分
          <select name="rating">
            <option value="5">5 分，很滿意</option>
            <option value="4">4 分，滿意</option>
            <option value="3">3 分，普通</option>
            <option value="2">2 分，不太滿意</option>
            <option value="1">1 分，很不滿意</option>
          </select>
        </label>

        <label>心得
          <textarea name="comment" placeholder="例如：處理很快、說明清楚、現場整理乾淨。"></textarea>
        </label>
      </section>

      <div class="page-actions">
        <button type="submit">送出評價</button>
      </div>
    </form>
  </main>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="/liff/app.js"></script>
</body>
</html>
