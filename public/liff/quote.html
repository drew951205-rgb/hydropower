<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>師傅報價 | 師傅抵嘉</title>
  <link rel="stylesheet" href="/liff/styles.css?v=20260515-2">
</head>
<body data-page="quote">
  <main class="page">
    <header class="page-header">
      <div class="hero-card">
        <p class="eyebrow">師傅抵嘉</p>
        <h1>師傅報價</h1>
        <p class="lead">把金額拆清楚，客戶看得懂，後續確認與到場安排也會更順。</p>
      </div>
    </header>

    <p id="status" class="notice" hidden></p>
    <section id="order-panel" class="panel">載入案件中...</section>
    <section id="photos" class="photo-grid"></section>

    <form id="quote-form" class="form-shell">
      <section class="form-section">
        <div class="section-title">
          <h2>報價組成</h2>
          <p>把基本費、材料費、工資拆開，客戶和平台都比較容易確認。</p>
        </div>

        <div class="row">
          <label>基本費
            <input name="basic_fee" type="number" min="0" value="0" required>
          </label>
          <label>材料費
            <input name="material_fee" type="number" min="0" value="0" required>
          </label>
        </div>

        <label>工資
          <input name="labor_fee" type="number" min="0" value="0" required>
        </label>

        <p class="notice">報價總額：<strong id="quote-total">0 元</strong></p>
      </section>

      <section class="form-section">
        <div class="section-title">
          <h2>到場安排</h2>
          <p>這裡填的是師傅預計到場時間，客戶確認頁只會看到這個時間，不會混到客戶自己的需求時間。</p>
        </div>

        <label>師傅預計到場時間
          <input name="estimated_arrival_time" type="datetime-local" required>
        </label>

        <label>備註
          <textarea name="note" placeholder="例如：到場前會先電話聯絡、材料需現場再確認"></textarea>
        </label>
      </section>

      <div class="page-actions">
        <button type="submit">送出報價</button>
      </div>
    </form>
  </main>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="/liff/app.js?v=20260515-2"></script>
</body>
</html>
